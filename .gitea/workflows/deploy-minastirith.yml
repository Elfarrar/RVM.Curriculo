name: Deploy MinasTirith

# Publica o site estatico (rvmtech.com.br) no MinasTirith: build Astro -> backup -> rsync --delete -> verificacao.
# Segunda forma de publicacao; o GitHub Pages (.github/workflows/deploy.yml) segue ligado ate a virada do DNS.
#
# Secrets do repo (valores nunca em arquivo): MINASTIRITH_HOST, MINASTIRITH_PORT, MINASTIRITH_USER,
# MINASTIRITH_SSH_KEY_B64 (chave privada em base64).

on:
  push:
    branches: [prd]
  # Na forja, .gitea/workflows tem precedencia sobre .github/workflows: sem isto o PR ficaria sem CI.
  # No PR so roda o job `build` (confere o build); o `deploy` so em push na prd / disparo manual.
  pull_request:
    branches: [prd]
  workflow_dispatch:
  # Artigo com data futura so entra no build do dia: rebuild diario as 00:05 de Brasilia.
  schedule:
    - cron: "5 3 * * *"

concurrency:
  group: deploy-minastirith
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/nginx/manager/rvmtech

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Testes do workflow (CA1, CA3, CA4)
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml
          bash tests/deploy-minastirith.test.sh

      - name: Upload dist
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/prd'
    steps:
      - name: Download dist
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist

      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.MINASTIRITH_SSH_KEY_B64 }}
          HOST: ${{ secrets.MINASTIRITH_HOST }}
          PORT: ${{ secrets.MINASTIRITH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | tr -d '\r\n' | base64 -d > ~/.ssh/id_ed25519
          # Chave sem a quebra de linha final = "error in libcrypto" (causa dos runs #6, #10 e #12): garante o "\n".
          [ -n "$(tail -c1 ~/.ssh/id_ed25519)" ] && echo >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::MINASTIRITH_SSH_KEY_B64 nao e uma chave privada valida"; exit 1; }
          for i in 1 2 3; do
            if ssh-keyscan -T 10 -p "${PORT:-22}" -H "$HOST" > keyscan.out 2>/dev/null && [ -s keyscan.out ]; then
              cat keyscan.out >> ~/.ssh/known_hosts; rm -f keyscan.out; exit 0
            fi
            sleep 5
          done
          echo "::error::ssh-keyscan falhou 3x"; exit 1

      - name: Backup do que esta publicado
        env:
          HOST: ${{ secrets.MINASTIRITH_HOST }}
          PORT: ${{ secrets.MINASTIRITH_PORT }}
          USER_: ${{ secrets.MINASTIRITH_USER }}
        run: |
          # ssh/rsync escrevem host, porta e usuario no stderr em falha de conexao: mascara antes de ir ao log (CA4).
          mask() { sed -e "s|${HOST}|***|g" -e "s|${USER_}|***|g" -e "s|port ${PORT:-22}|port ***|g"; }
          ssh -i ~/.ssh/id_ed25519 -p "${PORT:-22}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "${USER_}@${HOST}" \
            "mkdir -p '${DEPLOY_PATH}' && tar -czf '${DEPLOY_PATH}.bak.tgz' -C \"\$(dirname '${DEPLOY_PATH}')\" \"\$(basename '${DEPLOY_PATH}')\" && ls -lh '${DEPLOY_PATH}.bak.tgz'" 2>&1 | mask

      - name: Publish (rsync --delete)
        env:
          HOST: ${{ secrets.MINASTIRITH_HOST }}
          PORT: ${{ secrets.MINASTIRITH_PORT }}
          USER_: ${{ secrets.MINASTIRITH_USER }}
        run: |
          # ssh/rsync escrevem host, porta e usuario no stderr em falha de conexao: mascara antes de ir ao log (CA4).
          mask() { sed -e "s|${HOST}|***|g" -e "s|${USER_}|***|g" -e "s|port ${PORT:-22}|port ***|g"; }
          # Falha de rede: ate 3 tentativas (rsync e idempotente); depois disso o job fica vermelho (backup ja feito).
          for i in 1 2 3; do
            rsync -a --delete \
              -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT:-22} -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
              dist/ "${USER_}@${HOST}:${DEPLOY_PATH}/" 2>&1 | mask && exit 0
            echo "::warning::rsync falhou (tentativa $i de 3)"; sleep 10
          done
          echo "::error::rsync falhou 3x; o backup anterior esta em ${DEPLOY_PATH}.bak.tgz"; exit 1

      - name: Verify (no servidor)
        env:
          HOST: ${{ secrets.MINASTIRITH_HOST }}
          PORT: ${{ secrets.MINASTIRITH_PORT }}
          USER_: ${{ secrets.MINASTIRITH_USER }}
        run: |
          # ssh/rsync escrevem host, porta e usuario no stderr em falha de conexao: mascara antes de ir ao log (CA4).
          mask() { sed -e "s|${HOST}|***|g" -e "s|${USER_}|***|g" -e "s|port ${PORT:-22}|port ***|g"; }
          ssh -i ~/.ssh/id_ed25519 -p "${PORT:-22}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "${USER_}@${HOST}" \
            "cd '${DEPLOY_PATH}' && for f in index.html artigos/ia-salvou-meu-trabalho/index.html en/articles/ai-saved-my-career/index.html; do test -f \"\$f\" || { echo \"FALTA: \$f\"; exit 1; }; done; echo 'verificacao ok'" 2>&1 | mask
