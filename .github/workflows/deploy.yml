name: Deploy CV to GitHub Pages

on:
  push:
    branches:
      - prd
  pull_request:
    branches:
      - prd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Na forja (origem desde 14/10/2026) o job so confere o build; o Pages so existe no GitHub, que recebe a
      # prd pelo espelho (/opt/espelhar-prd.sh) e publica a partir desse push.
      - name: Upload Pages Artifact
        if: github.server_url == 'https://github.com'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # workflow_dispatch = o RVM.Depoimentos republicando apos uma aprovacao (TASK-839). Sem ele aqui, o
    # disparo construia o site e NAO publicava.
    if: github.server_url == 'https://github.com' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/prd'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
