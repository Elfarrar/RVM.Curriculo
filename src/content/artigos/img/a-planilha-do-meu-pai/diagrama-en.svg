        <rect class="mask" x="438" y="172" width="84" height="14" rx="2"/>
        <text class="lbl" x="480" y="182" text-anchor="middle">BETTER SPEC</text>
        <rect class="mask" x="40" y="40" width="196" height="80" rx="6"/>
        <rect class="warn" x="40" y="40" width="196" height="80" rx="6"/>
        <text class="name" x="138" y="77" text-anchor="middle">I write the spec</text>
        <text class="sub" x="138" y="94" text-anchor="middle">"block expired"</text>
        <rect class="mask" x="268" y="40" width="196" height="80" rx="6"/>
        <rect class="ai" x="268" y="40" width="196" height="80" rx="6"/>
        <text class="name" x="366" y="77" text-anchor="middle">The AI implements</text>
        <text class="sub" x="366" y="94" text-anchor="middle">exactly what was asked</text>
        <rect class="mask" x="496" y="40" width="196" height="80" rx="6"/>
        <rect class="ok" x="496" y="40" width="196" height="80" rx="6"/>
        <text class="name" x="594" y="69" text-anchor="middle">Tests turn green</text>
        <text class="sub" x="594" y="86" text-anchor="middle">they check the request,</text>
        <text class="sub" x="594" y="102" text-anchor="middle">not the intent</text>
        <rect class="mask" x="724" y="40" width="196" height="80" rx="6"/>
        <rect class="focal" x="724" y="40" width="196" height="80" rx="6"/>
        <text class="name" x="822" y="77" text-anchor="middle">The real user reviews</text>
        <text class="sub" x="822" y="94" text-anchor="middle">finds the missing case</text>
        <text class="callout" x="810" y="160" text-anchor="end">"And who never handed one in?"</text>
        <text class="callout" x="480" y="244" text-anchor="middle">A green test proves the system does what I asked.</text>
        <text class="callout" x="480" y="264" text-anchor="middle">Only the user proves I asked for the right thing.</text>
        <line class="hair" x1="40" y1="292" x2="920" y2="292"/>
