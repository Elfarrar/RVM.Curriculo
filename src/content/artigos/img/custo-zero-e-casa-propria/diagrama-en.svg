        <rect class="bg" width="100%" height="100%"/>

        <!-- Zona: a forja própria -->
        <rect class="zone" x="264" y="64" width="464" height="148" rx="8"/>
        <text class="eyebrow acc-t" x="280" y="88">OWN FORGE · ORIGIN</text>
        <text class="sub" x="280" y="108">no port open to the internet · production secrets stay here</text>

        <!-- Setas -->
        <path class="arr" d="M200 156 H276" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr" d="M408 156 H428" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr" d="M560 156 H580" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr-ok" d="M712 156 H780" marker-end="url(#diagrama-en-arrow-ok)"/>
        <rect class="mask" x="724" y="134" width="48" height="14" rx="2"/>
        <text class="lbl ok-t" x="748" y="144" text-anchor="middle">DEPLOY</text>
        <path class="arr dash" d="M496 184 V292" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="504" y="236" width="164" height="14" rx="2"/>
        <text class="lbl" x="508" y="246">EVERY 15 MIN · PRD ONLY</text>

        <!-- Nós -->
        <rect class="mask" x="40" y="128" width="160" height="56" rx="6"/>
        <rect class="ai" x="40" y="128" width="160" height="56" rx="6"/>
        <text class="name" x="120" y="152" text-anchor="middle">Me and agents</text>
        <text class="sub" x="120" y="170" text-anchor="middle">via secure tunnel</text>

        <rect class="mask" x="280" y="128" width="128" height="56" rx="6"/>
        <rect class="focal" x="280" y="128" width="128" height="56" rx="6"/>
        <text class="name" x="344" y="152" text-anchor="middle">Code</text>
        <text class="sub" x="344" y="170" text-anchor="middle">dev · stg · prd</text>

        <rect class="node" x="432" y="128" width="128" height="56" rx="6"/>
        <text class="name" x="496" y="152" text-anchor="middle">Pipeline</text>
        <text class="sub" x="496" y="170" text-anchor="middle">tests and build</text>

        <rect class="node" x="584" y="128" width="128" height="56" rx="6"/>
        <text class="name" x="648" y="152" text-anchor="middle">Deploy</text>
        <text class="sub" x="648" y="170" text-anchor="middle">dev · stg · prd</text>

        <rect class="mask" x="784" y="128" width="136" height="56" rx="6"/>
        <rect class="ok" x="784" y="128" width="136" height="56" rx="6"/>
        <text class="name" x="852" y="152" text-anchor="middle">Servers</text>
        <text class="sub" x="852" y="170" text-anchor="middle">dev · stg · prd</text>

        <rect class="node" x="408" y="296" width="176" height="56" rx="6" style="fill:var(--paper);stroke:var(--soft)"/>
        <text class="name" x="496" y="320" text-anchor="middle">GitHub (archive)</text>
        <text class="sub" x="496" y="338" text-anchor="middle">pipelines turned off</text>

        <text class="callout" x="480" y="392" text-anchor="middle">If the forge fails, production code exists outside. If GitHub disappears, nothing stops.</text>

        <!-- Legenda -->
        <line class="hair" x1="40" y1="416" x2="920" y2="416"/>
        <text class="eyebrow" x="40" y="440">LEGEND</text>
        <path class="arr" d="M136 436 H168" marker-end="url(#diagrama-en-arrow)"/>
        <text class="sub" x="176" y="440">workflow</text>
        <path class="arr dash" d="M312 436 H344" marker-end="url(#diagrama-en-arrow)"/>
        <text class="sub" x="352" y="440">copy, prd only</text>
        <rect class="focal" x="476" y="430" width="16" height="12" rx="2"/>
        <text class="sub" x="500" y="440">code origin</text>
        <rect class="ok" x="628" y="430" width="16" height="12" rx="2"/>
        <text class="sub" x="652" y="440">in production</text>
        <rect class="ai" x="768" y="430" width="16" height="12" rx="2"/>
        <text class="sub" x="792" y="440">me and agents</text>
      </svg>
