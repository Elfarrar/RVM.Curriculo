      #diagrama-en-root { font-family: 'Inter', system-ui, sans-serif; color: var(--page-ink); }
      #diagrama-en-root .diagram-container { width: 100%; overflow-x: auto; }
      #diagrama-en-root .diagram-container { overflow-x: visible; }
      #diagrama-en-root .rvm-d { --paper:#F4F5FA; --card:#FFFFFF; --ink:#28243D; --muted:#4D5056; --soft:#676C74;
