                     --rule:rgba(244,245,250,0.12); --rule-solid:#5B5774; --accent:#8FA5F5; --accent-tint:rgba(143,165,245,0.12);
                     --ok:#6AD01F; --ok-line:#6AD01F; --ok-tint:rgba(106,208,31,0.14);
                     --bad:#FF6166; --bad-line:#FF6166; --bad-tint:rgba(255,97,102,0.14);
                     --warn:#FFB547; --warn-line:#FFB547; --warn-tint:rgba(255,181,71,0.14);
                     --ai:#B79CFF; --ai-line:#B79CFF; --ai-tint:rgba(183,156,255,0.14); }
