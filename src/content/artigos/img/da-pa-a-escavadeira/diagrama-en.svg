          <marker id="diagrama-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-acc" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-ok" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-warn" points="0 0, 8 3, 0 6"/></marker>
