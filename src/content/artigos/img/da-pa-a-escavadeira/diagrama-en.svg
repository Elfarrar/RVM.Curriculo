        <rect class="bg" width="100%" height="100%"/>
        <rect class="zone" x="40" y="32" width="424" height="368" rx="8"/>
        <text class="eyebrow" x="56" y="56" text-anchor="start">THE SHOVEL: COPY AND PASTE</text>
        <rect class="zone" x="496" y="32" width="424" height="368" rx="8"/>
        <text class="eyebrow" x="512" y="56" text-anchor="start">THE EXCAVATOR: A SINGLE LOOP</text>
        <path class="arr" d="M204 100 H152" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="162" y="76" width="28" height="14" rx="2"/>
        <text class="lbl" x="176" y="86" text-anchor="middle">1·4</text>
        <path class="arr" d="M148 120 H200" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="168" y="130" width="16" height="14" rx="2"/>
        <text class="lbl" x="176" y="140" text-anchor="middle">2</text>
        <path class="arr" d="M296 100 H348" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="316" y="76" width="16" height="14" rx="2"/>
        <text class="lbl" x="324" y="86" text-anchor="middle">2</text>
        <path class="arr" d="M352 120 H300" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="316" y="130" width="16" height="14" rx="2"/>
        <text class="lbl" x="324" y="140" text-anchor="middle">3</text>
        <rect class="mask" x="56" y="80" width="92" height="56" rx="6"/>
        <rect class="ai" x="56" y="80" width="92" height="56" rx="6"/>
        <text class="name" x="102" y="105" text-anchor="middle">AI</text>
        <text class="sub" x="102" y="122" text-anchor="middle">in a browser</text>
        <rect class="mask" x="204" y="80" width="92" height="56" rx="6"/>
        <rect class="warn" x="204" y="80" width="92" height="56" rx="6"/>
        <text class="name" x="250" y="105" text-anchor="middle">Me</text>
        <text class="sub" x="250" y="122" text-anchor="middle">copy, paste</text>
        <rect class="mask" x="352" y="80" width="92" height="56" rx="6"/>
        <rect class="node" x="352" y="80" width="92" height="56" rx="6"/>
        <text class="name" x="398" y="105" text-anchor="middle">Project</text>
        <text class="sub" x="398" y="122" text-anchor="middle">local code</text>
        <text class="sub warn-t" x="72" y="184" text-anchor="start">1  I ask for a file</text>
        <text class="sub warn-t" x="72" y="206" text-anchor="start">2  I copy and paste</text>
        <text class="sub warn-t" x="72" y="228" text-anchor="start">3  I build: error</text>
        <text class="sub warn-t" x="72" y="250" text-anchor="start">4  I copy the error back</text>
        <text class="callout" x="60" y="344" text-anchor="start">Every turn goes through my hands.</text>
        <text class="callout" x="60" y="364" text-anchor="start">The AI never sees the whole project.</text>
        <path class="arr" d="M676 136 V200" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="616" y="162" width="56" height="14" rx="2"/>
        <text class="lbl" x="668" y="172" text-anchor="end">REQUEST</text>
        <path class="arr-ok" d="M740 200 V140" marker-end="url(#diagrama-en-arrow-ok)"/>
        <rect class="mask" x="744" y="156" width="48" height="14" rx="2"/>
        <text class="lbl" x="748" y="166" text-anchor="start">RESULT</text>
        <text class="sub" x="748" y="184" text-anchor="start">+ screenshot</text>
        <path class="arr-ok" d="M812 236 H836 Q844 236 844 244 V284 Q844 292 836 292 H816" marker-end="url(#diagrama-en-arrow-ok)"/>
        <rect class="mask" x="848" y="258" width="44" height="14" rx="2"/>
        <text class="lbl" x="852" y="268" text-anchor="start">ALONE</text>
        <rect class="mask" x="604" y="80" width="208" height="56" rx="6"/>
        <rect class="node" x="604" y="80" width="208" height="56" rx="6"/>
        <text class="name" x="708" y="105" text-anchor="middle">I decide and check</text>
        <text class="sub" x="708" y="122" text-anchor="middle">request and result</text>
        <rect class="mask" x="604" y="204" width="208" height="116" rx="6"/>
        <rect class="ai" x="604" y="204" width="208" height="116" rx="6"/>
        <text class="name ai-t" x="708" y="228" text-anchor="middle">Agent</text>
        <text class="sub" x="708" y="250" text-anchor="middle">reads the project</text>
        <text class="sub" x="708" y="268" text-anchor="middle">writes the code</text>
        <text class="sub" x="708" y="286" text-anchor="middle">builds and tests</text>
        <text class="sub" x="708" y="304" text-anchor="middle">reads the error, fixes</text>
        <text class="callout" x="516" y="344" text-anchor="start">The loop runs many turns on its own.</text>
        <text class="callout" x="516" y="364" text-anchor="start">I only step in to decide and check.</text>
        <line class="hair" x1="40" y1="424" x2="920" y2="424"/>
        <text class="eyebrow" x="40" y="448" text-anchor="start">LEGEND</text>
        <rect class="warn" x="140" y="436" width="24" height="14" rx="3"/>
        <text class="sub" x="176" y="448" text-anchor="start">work by my hand</text>
        <rect class="ai" x="330" y="436" width="24" height="14" rx="3"/>
        <text class="sub" x="366" y="448" text-anchor="start">AI</text>
        <path class="arr-ok" d="M427 444 H459" marker-end="url(#diagrama-en-arrow-ok)"/>
        <text class="sub" x="467" y="448" text-anchor="start">turn without me</text>
      </svg>
