        <rect class="bg" width="100%" height="100%"/>
        <rect class="zone" x="40" y="32" width="424" height="368" rx="8"/>
        <text class="eyebrow" x="56" y="56" text-anchor="start">A PÁ: COPIAR E COLAR</text>
        <rect class="zone" x="496" y="32" width="424" height="368" rx="8"/>
        <text class="eyebrow" x="512" y="56" text-anchor="start">A ESCAVADEIRA: UM CICLO SÓ</text>
        <path class="arr" d="M204 100 H152" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="162" y="76" width="28" height="14" rx="2"/>
        <text class="lbl" x="176" y="86" text-anchor="middle">1·4</text>
        <path class="arr" d="M148 120 H200" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="168" y="130" width="16" height="14" rx="2"/>
        <text class="lbl" x="176" y="140" text-anchor="middle">2</text>
        <path class="arr" d="M296 100 H348" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="316" y="76" width="16" height="14" rx="2"/>
        <text class="lbl" x="324" y="86" text-anchor="middle">2</text>
        <path class="arr" d="M352 120 H300" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="316" y="130" width="16" height="14" rx="2"/>
        <text class="lbl" x="324" y="140" text-anchor="middle">3</text>
        <rect class="mask" x="56" y="80" width="92" height="56" rx="6"/>
        <rect class="ai" x="56" y="80" width="92" height="56" rx="6"/>
        <text class="name" x="102" y="105" text-anchor="middle">IA</text>
        <text class="sub" x="102" y="122" text-anchor="middle">no navegador</text>
        <rect class="mask" x="204" y="80" width="92" height="56" rx="6"/>
        <rect class="warn" x="204" y="80" width="92" height="56" rx="6"/>
        <text class="name" x="250" y="105" text-anchor="middle">Eu</text>
        <text class="sub" x="250" y="122" text-anchor="middle">copio e colo</text>
        <rect class="mask" x="352" y="80" width="92" height="56" rx="6"/>
        <rect class="node" x="352" y="80" width="92" height="56" rx="6"/>
        <text class="name" x="398" y="105" text-anchor="middle">Projeto</text>
        <text class="sub" x="398" y="122" text-anchor="middle">código local</text>
        <text class="sub warn-t" x="72" y="184" text-anchor="start">1  peço um arquivo</text>
        <text class="sub warn-t" x="72" y="206" text-anchor="start">2  copio e colo</text>
        <text class="sub warn-t" x="72" y="228" text-anchor="start">3  compilo: erro</text>
        <text class="sub warn-t" x="72" y="250" text-anchor="start">4  copio o erro de volta</text>
        <text class="callout" x="60" y="344" text-anchor="start">Cada volta passa pela minha mão.</text>
        <text class="callout" x="60" y="364" text-anchor="start">A IA nunca vê o projeto inteiro.</text>
        <path class="arr" d="M676 136 V200" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="624" y="162" width="48" height="14" rx="2"/>
        <text class="lbl" x="668" y="172" text-anchor="end">PEDIDO</text>
        <path class="arr-ok" d="M740 200 V140" marker-end="url(#diagrama-arrow-ok)"/>
        <rect class="mask" x="744" y="156" width="72" height="14" rx="2"/>
        <text class="lbl" x="748" y="166" text-anchor="start">RESULTADO</text>
        <text class="sub" x="748" y="184" text-anchor="start">+ print da tela</text>
        <path class="arr-ok" d="M812 236 H836 Q844 236 844 244 V284 Q844 292 836 292 H816" marker-end="url(#diagrama-arrow-ok)"/>
        <rect class="mask" x="848" y="258" width="56" height="14" rx="2"/>
        <text class="lbl" x="852" y="268" text-anchor="start">SOZINHO</text>
        <rect class="mask" x="604" y="80" width="208" height="56" rx="6"/>
        <rect class="node" x="604" y="80" width="208" height="56" rx="6"/>
        <text class="name" x="708" y="105" text-anchor="middle">Eu decido e confiro</text>
        <text class="sub" x="708" y="122" text-anchor="middle">pedido e resultado</text>
        <rect class="mask" x="604" y="204" width="208" height="116" rx="6"/>
        <rect class="ai" x="604" y="204" width="208" height="116" rx="6"/>
        <text class="name ai-t" x="708" y="228" text-anchor="middle">Agente</text>
        <text class="sub" x="708" y="250" text-anchor="middle">lê o projeto</text>
        <text class="sub" x="708" y="268" text-anchor="middle">escreve o código</text>
        <text class="sub" x="708" y="286" text-anchor="middle">compila e testa</text>
        <text class="sub" x="708" y="304" text-anchor="middle">lê o erro e corrige</text>
        <text class="callout" x="516" y="344" text-anchor="start">O ciclo dá várias voltas sozinho.</text>
        <text class="callout" x="516" y="364" text-anchor="start">Eu entro só na decisão e no resultado.</text>
        <line class="hair" x1="40" y1="424" x2="920" y2="424"/>
        <text class="eyebrow" x="40" y="448" text-anchor="start">LEGENDA</text>
        <rect class="warn" x="140" y="436" width="24" height="14" rx="3"/>
        <text class="sub" x="176" y="448" text-anchor="start">trabalho na minha mão</text>
        <rect class="ai" x="370" y="436" width="24" height="14" rx="3"/>
        <text class="sub" x="406" y="448" text-anchor="start">IA</text>
        <path class="arr-ok" d="M467 444 H499" marker-end="url(#diagrama-arrow-ok)"/>
        <text class="sub" x="507" y="448" text-anchor="start">volta sem mim</text>
      </svg>
