      #diagrama-en-root .rvm-d .arr-ok { fill:none; stroke:var(--ok-line);  stroke-width:1.6; }
      #diagrama-en-root .rvm-d .arr-bad { fill:none; stroke:var(--bad-line); stroke-width:1.6; }
