          <marker id="diagrama-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-acc" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-ok" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-bad" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="bg" width="100%" height="100%"/>

        <!-- Zonas -->
        <rect class="zone" x="36" y="40" width="320" height="392" rx="8"/>
        <text class="eyebrow bad-t" x="52" y="64">BEFORE: HORIZONTAL LAYERS</text>
        <rect class="zone" x="388" y="40" width="536" height="392" rx="8"/>
        <text class="eyebrow acc-t" x="404" y="64">AFTER: VERTICAL SLICES + DOMAIN</text>

        <!-- Antes: camadas horizontais -->
        <rect class="node" x="52" y="88" width="288" height="72" rx="6"/>
        <text class="name" x="212" y="120" text-anchor="middle">Screens</text>
        <text class="sub" x="212" y="138" text-anchor="middle">every screen in the system</text>
        <rect class="node" x="52" y="176" width="288" height="72" rx="6"/>
        <text class="name" x="212" y="208" text-anchor="middle">Rules</text>
        <text class="sub" x="212" y="226" text-anchor="middle">every rule, all mixed</text>
        <rect class="node" x="52" y="264" width="288" height="72" rx="6"/>
        <text class="name" x="212" y="296" text-anchor="middle">Data</text>
        <text class="sub" x="212" y="314" text-anchor="middle">all database access</text>
        <!-- uma funcionalidade espalhada pelas três camadas -->
        <path class="arr-bad dash2" d="M76 124 V292" marker-end="url(#diagrama-en-arrow-bad)"/>
        <circle class="ah-bad" cx="76" cy="124" r="4"/>
        <circle class="ah-bad" cx="76" cy="212" r="4"/>
        <text class="callout bad-t" x="196" y="372" text-anchor="middle">1 feature = 3 or more folders,</text>
        <text class="callout bad-t" x="196" y="392" text-anchor="middle">and hope you don't forget one.</text>

        <!-- Depois: fatias verticais sobre o domínio -->
        <path class="arr-ok" d="M480 280 V316" marker-end="url(#diagrama-en-arrow-ok)"/>
        <path class="arr-ok" d="M656 280 V316" marker-end="url(#diagrama-en-arrow-ok)"/>
        <path class="arr-ok" d="M832 280 V316" marker-end="url(#diagrama-en-arrow-ok)"/>
        <rect class="mask" x="404" y="80" width="504" height="48" rx="6"/>
        <rect class="warn" x="404" y="80" width="504" height="48" rx="6"/>
        <text class="name" x="656" y="100" text-anchor="middle">Applied to every route, in one place</text>
        <text class="sub" x="656" y="118" text-anchor="middle">permission · company · transaction</text>
        <rect class="mask" x="404" y="144" width="152" height="136" rx="6"/>
        <rect class="focal" x="404" y="144" width="152" height="136" rx="6"/>
        <text class="name acc-t" x="480" y="170" text-anchor="middle">Register a field</text>
        <text class="sub" x="480" y="196" text-anchor="middle">route</text>
        <text class="sub" x="480" y="214" text-anchor="middle">validation</text>
        <text class="sub" x="480" y="232" text-anchor="middle">handler</text>
        <text class="sub" x="480" y="250" text-anchor="middle">response</text>
        <rect class="mask" x="580" y="144" width="152" height="136" rx="6"/>
        <rect class="focal" x="580" y="144" width="152" height="136" rx="6"/>
        <text class="name acc-t" x="656" y="170" text-anchor="middle">Assign a person</text>
        <text class="sub" x="656" y="196" text-anchor="middle">route</text>
        <text class="sub" x="656" y="214" text-anchor="middle">validation</text>
        <text class="sub" x="656" y="232" text-anchor="middle">handler</text>
        <text class="sub" x="656" y="250" text-anchor="middle">response</text>
        <rect class="mask" x="756" y="144" width="152" height="136" rx="6"/>
        <rect class="focal" x="756" y="144" width="152" height="136" rx="6"/>
        <text class="name acc-t" x="832" y="170" text-anchor="middle">Close the month</text>
        <text class="sub" x="832" y="196" text-anchor="middle">route</text>
        <text class="sub" x="832" y="214" text-anchor="middle">validation</text>
        <text class="sub" x="832" y="232" text-anchor="middle">handler</text>
        <text class="sub" x="832" y="250" text-anchor="middle">response</text>
        <rect class="mask" x="404" y="320" width="504" height="64" rx="6"/>
        <rect class="ok" x="404" y="320" width="504" height="64" rx="6"/>
        <text class="name" x="656" y="346" text-anchor="middle">Domain: the business rules, in one place</text>
        <text class="sub" x="656" y="366" text-anchor="middle">no database, no screens, no internet; tested alone</text>
        <text class="callout ok-t" x="656" y="412" text-anchor="middle">1 feature = 1 file.</text>

        <!-- Legenda -->
        <line class="hair" x1="36" y1="456" x2="924" y2="456"/>
        <text class="eyebrow" x="36" y="480">LEGEND</text>
        <path class="arr-bad dash2" d="M136 476 H168" marker-end="url(#diagrama-en-arrow-bad)"/>
        <text class="sub" x="176" y="480">one feature, scattered</text>
        <path class="arr-ok" d="M460 476 H492" marker-end="url(#diagrama-en-arrow-ok)"/>
        <text class="sub" x="500" y="480">the slice uses the domain</text>
      </svg>
