      #diagrama-en-root .rvm-d .eyebrow { font-size:10px; font-weight:500; letter-spacing:0.16em; fill:var(--muted); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-en-root .rvm-d .lbl { font-size:10px; letter-spacing:0.06em; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-en-root .rvm-d .lbl-acc { fill:var(--accent); }
      #diagrama-en-root .rvm-d .callout { font-size:13px; font-style:italic; fill:var(--muted); }
