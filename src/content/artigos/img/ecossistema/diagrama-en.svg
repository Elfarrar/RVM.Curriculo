      #diagrama-en-root .rvm-d .arr { fill:none; stroke:var(--muted); stroke-width:1.2; }
      #diagrama-en-root .rvm-d .arr-acc { fill:none; stroke:var(--accent); stroke-width:1.6; }
      #diagrama-en-root .rvm-d .dash { stroke-dasharray:5 4; }
