      #diagrama-en-root .rvm-d .focal { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
      #diagrama-en-root .rvm-d .name { font-size:14px; font-weight:600; }
      #diagrama-en-root .rvm-d .env { font-size:16px; font-weight:600; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
