          <marker id="diagrama-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-acc" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-ok" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-bad" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="bg" width="100%" height="100%"/>

        <!-- Zonas: os quatro servidores -->
        <rect class="zone" x="288" y="40" width="472" height="120" rx="8"/>
        <text class="eyebrow" x="304" y="64">INTERNAL SERVICES</text>
        <rect class="zone" x="40" y="216" width="420" height="148" rx="8"/>
        <text class="eyebrow" x="56" y="240">STAGING</text>
        <rect class="zone" x="500" y="216" width="420" height="148" rx="8"/>
        <text class="eyebrow ok-t" x="516" y="240">PRODUCTION</text>
        <rect class="zone" x="500" y="400" width="420" height="104" rx="8"/>
        <text class="eyebrow" x="516" y="424">BACKUP AND ALERTS</text>

        <!-- Setas -->
        <path class="arr" d="M208 96 H300" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="228" y="74" width="56" height="14" rx="2"/>
        <text class="lbl" x="256" y="84" text-anchor="middle">REQUEST</text>
        <path class="arr" d="M304 120 H212" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="214" y="128" width="84" height="14" rx="2"/>
        <text class="lbl" x="256" y="138" text-anchor="middle">APPROVALS</text>
        <path class="arr dash" d="M740 108 H804" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="748" y="86" width="52" height="14" rx="2"/>
        <text class="lbl" x="774" y="96" text-anchor="middle">PRD ONLY</text>
        <path class="arr" d="M690 136 V180 Q690 188 682 188 H208 Q200 188 200 196 V248" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="376" y="166" width="88" height="14" rx="2"/>
        <text class="lbl" x="420" y="176" text-anchor="middle">AUTOMATIC</text>
        <path class="arr" d="M236 280 H260" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr-acc" d="M432 280 H496" marker-end="url(#diagrama-en-arrow-accent)"/>
        <rect class="mask" x="436" y="258" width="60" height="14" rx="2"/>
        <text class="lbl lbl-acc" x="466" y="268" text-anchor="middle">APPROVED</text>
        <path class="arr dash" d="M680 364 V436" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="688" y="372" width="100" height="14" rx="2"/>
        <text class="lbl" x="692" y="382">PULLS COPIES</text>

        <!-- Eu -->
        <rect class="mask" x="40" y="56" width="168" height="88" rx="6"/>
        <rect class="warn" x="40" y="56" width="168" height="88" rx="6"/>
        <text class="name" x="124" y="80" text-anchor="middle">Me</text>
        <text class="sub" x="124" y="100" text-anchor="middle">PC with WSL</text>
        <text class="sub" x="124" y="116" text-anchor="middle">Claude Code and Codex</text>
        <text class="sub" x="124" y="132" text-anchor="middle">I approve by phone</text>

        <!-- Serviços internos -->
        <rect class="mask" x="304" y="80" width="100" height="56" rx="6"/>
        <rect class="ai" x="304" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="354" y="104" text-anchor="middle">Maestro</text>
        <text class="sub" x="354" y="122" text-anchor="middle">6 roles</text>
        <rect class="mask" x="416" y="80" width="100" height="56" rx="6"/>
        <rect class="ai" x="416" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="466" y="104" text-anchor="middle">Executors</text>
        <text class="sub" x="466" y="122" text-anchor="middle">agents</text>
        <rect class="node" x="528" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="578" y="104" text-anchor="middle">Ansible</text>
        <text class="sub" x="578" y="122" text-anchor="middle">infra as code</text>
        <rect class="mask" x="640" y="80" width="100" height="56" rx="6"/>
        <rect class="focal" x="640" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="690" y="104" text-anchor="middle">Forge</text>
        <text class="sub" x="690" y="122" text-anchor="middle">origin and CI</text>

        <rect class="node" x="808" y="80" width="112" height="56" rx="6" style="fill:var(--paper);stroke:var(--soft)"/>
        <text class="name" x="864" y="104" text-anchor="middle">GitHub</text>
        <text class="sub" x="864" y="122" text-anchor="middle">mirror</text>

        <!-- Homologação -->
        <rect class="node" x="56" y="252" width="180" height="56" rx="6"/>
        <text class="env" x="146" y="276" text-anchor="middle">dev</text>
        <text class="sub" x="146" y="296" text-anchor="middle">each merge ships</text>
        <rect class="node" x="264" y="252" width="168" height="56" rx="6"/>
        <text class="env" x="348" y="276" text-anchor="middle">stg</text>
        <text class="sub" x="348" y="296" text-anchor="middle">goes to prd</text>
        <rect class="opt" x="56" y="320" width="376" height="28" rx="6"/>
        <text class="sub" x="244" y="338" text-anchor="middle">demo · open for testing</text>

        <!-- Produção -->
        <rect class="mask" x="516" y="252" width="184" height="32" rx="6"/>
        <rect class="ok" x="516" y="252" width="184" height="32" rx="6"/>
        <text class="name" x="608" y="273" text-anchor="middle">Safra em Dia</text>
        <rect class="mask" x="720" y="252" width="184" height="32" rx="6"/>
        <rect class="ok" x="720" y="252" width="184" height="32" rx="6"/>
        <text class="name" x="812" y="273" text-anchor="middle">Obra em Dia</text>
        <rect class="mask" x="516" y="292" width="184" height="32" rx="6"/>
        <rect class="ok" x="516" y="292" width="184" height="32" rx="6"/>
        <text class="name" x="608" y="313" text-anchor="middle">Binder</text>
        <rect class="mask" x="720" y="292" width="184" height="32" rx="6"/>
        <rect class="ok" x="720" y="292" width="184" height="32" rx="6"/>
        <text class="name" x="812" y="313" text-anchor="middle">Payments</text>
        <text class="sub" x="516" y="348">databases on the internal network only</text>

        <!-- Backup e alertas -->
        <rect class="node" x="516" y="440" width="196" height="52" rx="6"/>
        <text class="name" x="614" y="464" text-anchor="middle">Pull-based backup</text>
        <text class="sub" x="614" y="482" text-anchor="middle">copies leave the hosting</text>
        <rect class="node" x="724" y="440" width="180" height="52" rx="6"/>
        <text class="name" x="814" y="464" text-anchor="middle">Uptime Kuma</text>
        <text class="sub" x="814" y="482" text-anchor="middle">alerts on Telegram</text>

        <text class="callout" x="40" y="436">4 servers · twenty-odd systems</text>
        <text class="callout" x="40" y="456">6 AI roles · 1 person</text>

        <!-- Legenda -->
        <line class="hair" x1="40" y1="528" x2="920" y2="528"/>
        <text class="eyebrow" x="40" y="552">LEGEND</text>
        <path class="arr" d="M136 548 H168" marker-end="url(#diagrama-en-arrow)"/>
        <text class="sub" x="176" y="552">automatic</text>
        <path class="arr-acc" d="M304 548 H336" marker-end="url(#diagrama-en-arrow-accent)"/>
        <text class="sub" x="344" y="552">only with my approval</text>
        <path class="arr dash" d="M504 548 H536" marker-end="url(#diagrama-en-arrow)"/>
        <text class="sub" x="544" y="552">copy</text>
        <rect class="ai" x="600" y="542" width="16" height="12" rx="2"/>
        <text class="sub" x="624" y="552">AI agents</text>
        <rect class="ok" x="732" y="542" width="16" height="12" rx="2"/>
        <text class="sub" x="756" y="552">production</text>
        <rect class="warn" x="832" y="542" width="16" height="12" rx="2"/>
        <text class="sub" x="856" y="552">me</text>
      </svg>
