<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 572" xmlns="http://www.w3.org/2000/svg" class="rvm-d" role="img" aria-labelledby="diagrama-10-title diagrama-10-desc" id="diagrama-root">
        <title id="diagrama-10-title">O ambiente RVM</title>
        <desc id="diagrama-10-desc">Quatro servidores: os serviços internos com a forja de onde o código nasce, a homologação que recebe cada merge sozinha, a produção que só recebe com o meu aprovado, e o backup que puxa as cópias e me avisa no Telegram.</desc>
        <style>
          .rvm-d { --paper:#F4F5FA; --card:#FFFFFF; --ink:#28243D; --muted:#4D5056; --soft:#676C74;
                   --rule:rgba(40,36,61,0.12); --rule-solid:#D1D0D3; --accent:#264CC8; --accent-tint:rgba(38,76,200,0.08);
                   --ok:#378100; --ok-line:#4CB200; --ok-tint:rgba(86,202,0,0.10);
                   --bad:#A33134; --bad-line:#E04347; --bad-tint:rgba(255,76,81,0.10);
                   --warn:#A37300; --warn-line:#E09E00; --warn-tint:rgba(255,180,0,0.12);
                   --ai:#6E3FD1; --ai-line:#8A63E0; --ai-tint:rgba(138,99,224,0.10); }
          @media (prefers-color-scheme: dark) {
            .rvm-d { --paper:#28243D; --card:#312D4B; --ink:#F4F5FA; --muted:#CFCBE5; --soft:#9C9FA4;
                     --rule:rgba(244,245,250,0.12); --rule-solid:#5B5774; --accent:#8FA5F5; --accent-tint:rgba(143,165,245,0.12);
                     --ok:#6AD01F; --ok-line:#6AD01F; --ok-tint:rgba(106,208,31,0.14);
                     --bad:#FF6166; --bad-line:#FF6166; --bad-tint:rgba(255,97,102,0.14);
                     --warn:#FFB547; --warn-line:#FFB547; --warn-tint:rgba(255,181,71,0.14);
                     --ai:#B79CFF; --ai-line:#B79CFF; --ai-tint:rgba(183,156,255,0.14); }
          }
          .rvm-d text { font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; fill:var(--ink); }
          .rvm-d .bg { fill:var(--paper); }
          .rvm-d .zone { fill:none; stroke:var(--rule-solid); stroke-width:1; stroke-dasharray:4 4; }
          .rvm-d .mask { fill:var(--paper); }
          .rvm-d .node { fill:var(--card); stroke:var(--ink); stroke-width:1; }
          .rvm-d .focal { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
          .rvm-d .name { font-size:14px; font-weight:600; }
          .rvm-d .env { font-size:16px; font-weight:600; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .sub { font-size:11px; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .eyebrow { font-size:10px; font-weight:500; letter-spacing:0.16em; fill:var(--muted); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .lbl { font-size:10px; letter-spacing:0.06em; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .lbl-acc { fill:var(--accent); }
          .rvm-d .callout { font-size:13px; font-style:italic; fill:var(--muted); }
          .rvm-d .acc-t { fill:var(--accent); }
          .rvm-d .arr { fill:none; stroke:var(--muted); stroke-width:1.2; }
          .rvm-d .arr-acc { fill:none; stroke:var(--accent); stroke-width:1.6; }
          .rvm-d .dash { stroke-dasharray:5 4; }
          .rvm-d .opt { fill:var(--card); stroke:var(--soft); stroke-width:1; stroke-dasharray:4 3; }
          .rvm-d .hair { stroke:var(--rule); stroke-width:1; }
          .rvm-d .ah { fill:var(--muted); }
          .rvm-d .ah-acc { fill:var(--accent); }
          .rvm-d .ok   { fill:var(--ok-tint);   stroke:var(--ok-line);   stroke-width:1.2; }
          .rvm-d .bad  { fill:var(--bad-tint);  stroke:var(--bad-line);  stroke-width:1.2; }
          .rvm-d .warn { fill:var(--warn-tint); stroke:var(--warn-line); stroke-width:1.2; }
          .rvm-d .ai   { fill:var(--ai-tint);   stroke:var(--ai-line);   stroke-width:1.2; }
          .rvm-d .ok-t { fill:var(--ok); } .rvm-d .bad-t { fill:var(--bad); } .rvm-d .warn-t { fill:var(--warn); } .rvm-d .ai-t { fill:var(--ai); }
          .rvm-d .arr-ok  { fill:none; stroke:var(--ok-line);  stroke-width:1.6; }
          .rvm-d .arr-bad { fill:none; stroke:var(--bad-line); stroke-width:1.6; }
          .rvm-d .ah-ok { fill:var(--ok-line); } .rvm-d .ah-bad { fill:var(--bad-line); }
        </style>
        <defs>
      <style>#diagrama-root { --page: #F4F5FA; --page-ink: #28243D; --page-muted: #4D5056; }
      #diagrama-root { --page: #28243D; --page-ink: #F4F5FA; --page-muted: #CFCBE5; }
      #diagrama-root { font-family: 'Inter', system-ui, sans-serif; color: var(--page-ink); }
      #diagrama-root .diagram-container { width: 100%; overflow-x: auto; }
      #diagrama-root .diagram-container { overflow-x: visible; }
      #diagrama-root .rvm-d { --paper:#F4F5FA; --card:#FFFFFF; --ink:#28243D; --muted:#4D5056; --soft:#676C74;
                   --rule:rgba(40,36,61,0.12); --rule-solid:#D1D0D3; --accent:#264CC8; --accent-tint:rgba(38,76,200,0.08);
                   --ok:#378100; --ok-line:#4CB200; --ok-tint:rgba(86,202,0,0.10);
                   --bad:#A33134; --bad-line:#E04347; --bad-tint:rgba(255,76,81,0.10);
                   --warn:#A37300; --warn-line:#E09E00; --warn-tint:rgba(255,180,0,0.12);
                   --ai:#6E3FD1; --ai-line:#8A63E0; --ai-tint:rgba(138,99,224,0.10); }
      #diagrama-root .rvm-d { --paper:#28243D; --card:#312D4B; --ink:#F4F5FA; --muted:#CFCBE5; --soft:#9C9FA4;
                     --rule:rgba(244,245,250,0.12); --rule-solid:#5B5774; --accent:#8FA5F5; --accent-tint:rgba(143,165,245,0.12);
                     --ok:#6AD01F; --ok-line:#6AD01F; --ok-tint:rgba(106,208,31,0.14);
                     --bad:#FF6166; --bad-line:#FF6166; --bad-tint:rgba(255,97,102,0.14);
                     --warn:#FFB547; --warn-line:#FFB547; --warn-tint:rgba(255,181,71,0.14);
                     --ai:#B79CFF; --ai-line:#B79CFF; --ai-tint:rgba(183,156,255,0.14); }
      #diagrama-root .rvm-d text { font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; fill:var(--ink); }
      #diagrama-root .rvm-d .bg { fill:var(--paper); }
      #diagrama-root .rvm-d .zone { fill:none; stroke:var(--rule-solid); stroke-width:1; stroke-dasharray:4 4; }
      #diagrama-root .rvm-d .mask { fill:var(--paper); }
      #diagrama-root .rvm-d .node { fill:var(--card); stroke:var(--ink); stroke-width:1; }
      #diagrama-root .rvm-d .focal { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
      #diagrama-root .rvm-d .name { font-size:14px; font-weight:600; }
      #diagrama-root .rvm-d .env { font-size:16px; font-weight:600; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-root .rvm-d .sub { font-size:11px; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-root .rvm-d .eyebrow { font-size:10px; font-weight:500; letter-spacing:0.16em; fill:var(--muted); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-root .rvm-d .lbl { font-size:10px; letter-spacing:0.06em; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-root .rvm-d .lbl-acc { fill:var(--accent); }
      #diagrama-root .rvm-d .callout { font-size:13px; font-style:italic; fill:var(--muted); }
      #diagrama-root .rvm-d .acc-t { fill:var(--accent); }
      #diagrama-root .rvm-d .arr { fill:none; stroke:var(--muted); stroke-width:1.2; }
      #diagrama-root .rvm-d .arr-acc { fill:none; stroke:var(--accent); stroke-width:1.6; }
      #diagrama-root .rvm-d .dash { stroke-dasharray:5 4; }
      #diagrama-root .rvm-d .opt { fill:var(--card); stroke:var(--soft); stroke-width:1; stroke-dasharray:4 3; }
      #diagrama-root .rvm-d .hair { stroke:var(--rule); stroke-width:1; }
      #diagrama-root .rvm-d .ah { fill:var(--muted); }
      #diagrama-root .rvm-d .ah-acc { fill:var(--accent); }
      #diagrama-root .rvm-d .ok { fill:var(--ok-tint);   stroke:var(--ok-line);   stroke-width:1.2; }
      #diagrama-root .rvm-d .bad { fill:var(--bad-tint);  stroke:var(--bad-line);  stroke-width:1.2; }
      #diagrama-root .rvm-d .warn { fill:var(--warn-tint); stroke:var(--warn-line); stroke-width:1.2; }
      #diagrama-root .rvm-d .ai { fill:var(--ai-tint);   stroke:var(--ai-line);   stroke-width:1.2; }
      #diagrama-root .rvm-d .ok-t { fill:var(--ok); }
      #diagrama-root .rvm-d .bad-t { fill:var(--bad); }
      #diagrama-root .rvm-d .warn-t { fill:var(--warn); }
      #diagrama-root .rvm-d .ai-t { fill:var(--ai); }
      #diagrama-root .rvm-d .arr-ok { fill:none; stroke:var(--ok-line);  stroke-width:1.6; }
      #diagrama-root .rvm-d .arr-bad { fill:none; stroke:var(--bad-line); stroke-width:1.6; }
      #diagrama-root .rvm-d .ah-ok { fill:var(--ok-line); }
      #diagrama-root .rvm-d .ah-bad { fill:var(--bad-line); }</style>
          <marker id="diagrama-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-acc" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-ok" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-arrow-bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-bad" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="bg" width="100%" height="100%"/>

        <!-- Zonas: os quatro servidores -->
        <rect class="zone" x="288" y="40" width="472" height="120" rx="8"/>
        <text class="eyebrow" x="304" y="64">SERVIÇOS INTERNOS</text>
        <rect class="zone" x="40" y="216" width="420" height="148" rx="8"/>
        <text class="eyebrow" x="56" y="240">HOMOLOGAÇÃO</text>
        <rect class="zone" x="500" y="216" width="420" height="148" rx="8"/>
        <text class="eyebrow ok-t" x="516" y="240">PRODUÇÃO</text>
        <rect class="zone" x="500" y="400" width="420" height="104" rx="8"/>
        <text class="eyebrow" x="516" y="424">BACKUP E ALERTAS</text>

        <!-- Setas -->
        <path class="arr" d="M208 96 H300" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="228" y="74" width="56" height="14" rx="2"/>
        <text class="lbl" x="256" y="84" text-anchor="middle">PEDIDO</text>
        <path class="arr" d="M304 120 H212" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="214" y="128" width="84" height="14" rx="2"/>
        <text class="lbl" x="256" y="138" text-anchor="middle">APROVAÇÕES</text>
        <path class="arr dash" d="M740 108 H804" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="748" y="86" width="52" height="14" rx="2"/>
        <text class="lbl" x="774" y="96" text-anchor="middle">SÓ PRD</text>
        <path class="arr" d="M690 136 V180 Q690 188 682 188 H208 Q200 188 200 196 V248" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="376" y="166" width="88" height="14" rx="2"/>
        <text class="lbl" x="420" y="176" text-anchor="middle">AUTOMÁTICO</text>
        <path class="arr" d="M236 280 H260" marker-end="url(#diagrama-arrow)"/>
        <path class="arr-acc" d="M432 280 H496" marker-end="url(#diagrama-arrow-accent)"/>
        <rect class="mask" x="436" y="258" width="60" height="14" rx="2"/>
        <text class="lbl lbl-acc" x="466" y="268" text-anchor="middle">APROVADO</text>
        <path class="arr dash" d="M680 364 V436" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="688" y="372" width="100" height="14" rx="2"/>
        <text class="lbl" x="692" y="382">PUXA AS CÓPIAS</text>

        <!-- Eu -->
        <rect class="mask" x="40" y="56" width="168" height="88" rx="6"/>
        <rect class="warn" x="40" y="56" width="168" height="88" rx="6"/>
        <text class="name" x="124" y="80" text-anchor="middle">Eu</text>
        <text class="sub" x="124" y="100" text-anchor="middle">PC com WSL</text>
        <text class="sub" x="124" y="116" text-anchor="middle">Claude Code e Codex</text>
        <text class="sub" x="124" y="132" text-anchor="middle">aprovo pelo celular</text>

        <!-- Serviços internos -->
        <rect class="mask" x="304" y="80" width="100" height="56" rx="6"/>
        <rect class="ai" x="304" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="354" y="104" text-anchor="middle">Maestro</text>
        <text class="sub" x="354" y="122" text-anchor="middle">6 papéis</text>
        <rect class="mask" x="416" y="80" width="100" height="56" rx="6"/>
        <rect class="ai" x="416" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="466" y="104" text-anchor="middle">Executores</text>
        <text class="sub" x="466" y="122" text-anchor="middle">agentes</text>
        <rect class="node" x="528" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="578" y="104" text-anchor="middle">Ansible</text>
        <text class="sub" x="578" y="122" text-anchor="middle">infra em IaC</text>
        <rect class="mask" x="640" y="80" width="100" height="56" rx="6"/>
        <rect class="focal" x="640" y="80" width="100" height="56" rx="6"/>
        <text class="name" x="690" y="104" text-anchor="middle">Forja</text>
        <text class="sub" x="690" y="122" text-anchor="middle">origem e CI</text>

        <rect class="node" x="808" y="80" width="112" height="56" rx="6" style="fill:var(--paper);stroke:var(--soft)"/>
        <text class="name" x="864" y="104" text-anchor="middle">GitHub</text>
        <text class="sub" x="864" y="122" text-anchor="middle">espelho</text>

        <!-- Homologação -->
        <rect class="node" x="56" y="252" width="180" height="56" rx="6"/>
        <text class="env" x="146" y="276" text-anchor="middle">dev</text>
        <text class="sub" x="146" y="296" text-anchor="middle">cada merge sobe</text>
        <rect class="node" x="264" y="252" width="168" height="56" rx="6"/>
        <text class="env" x="348" y="276" text-anchor="middle">stg</text>
        <text class="sub" x="348" y="296" text-anchor="middle">vai para a prd</text>
        <rect class="opt" x="56" y="320" width="376" height="28" rx="6"/>
        <text class="sub" x="244" y="338" text-anchor="middle">demo · aberta para teste</text>

        <!-- Produção -->
        <rect class="mask" x="516" y="252" width="184" height="32" rx="6"/>
        <rect class="ok" x="516" y="252" width="184" height="32" rx="6"/>
        <text class="name" x="608" y="273" text-anchor="middle">Safra em Dia</text>
        <rect class="mask" x="720" y="252" width="184" height="32" rx="6"/>
        <rect class="ok" x="720" y="252" width="184" height="32" rx="6"/>
        <text class="name" x="812" y="273" text-anchor="middle">Obra em Dia</text>
        <rect class="mask" x="516" y="292" width="184" height="32" rx="6"/>
        <rect class="ok" x="516" y="292" width="184" height="32" rx="6"/>
        <text class="name" x="608" y="313" text-anchor="middle">Binder</text>
        <rect class="mask" x="720" y="292" width="184" height="32" rx="6"/>
        <rect class="ok" x="720" y="292" width="184" height="32" rx="6"/>
        <text class="name" x="812" y="313" text-anchor="middle">Pagamentos</text>
        <text class="sub" x="516" y="348">bancos só na rede interna</text>

        <!-- Backup e alertas -->
        <rect class="node" x="516" y="440" width="196" height="52" rx="6"/>
        <text class="name" x="614" y="464" text-anchor="middle">Backup que puxa</text>
        <text class="sub" x="614" y="482" text-anchor="middle">cópias fora da hospedagem</text>
        <rect class="node" x="724" y="440" width="180" height="52" rx="6"/>
        <text class="name" x="814" y="464" text-anchor="middle">Uptime Kuma</text>
        <text class="sub" x="814" y="482" text-anchor="middle">alertas no Telegram</text>

        <text class="callout" x="40" y="436">4 servidores · vinte e poucos sistemas</text>
        <text class="callout" x="40" y="456">6 papéis de IA · 1 pessoa</text>

        <!-- Legenda -->
        <line class="hair" x1="40" y1="528" x2="920" y2="528"/>
        <text class="eyebrow" x="40" y="552">LEGENDA</text>
        <path class="arr" d="M136 548 H168" marker-end="url(#diagrama-arrow)"/>
        <text class="sub" x="176" y="552">automático</text>
        <path class="arr-acc" d="M304 548 H336" marker-end="url(#diagrama-arrow-accent)"/>
        <text class="sub" x="344" y="552">só com o meu aprovado</text>
        <path class="arr dash" d="M504 548 H536" marker-end="url(#diagrama-arrow)"/>
        <text class="sub" x="544" y="552">cópia</text>
        <rect class="ai" x="600" y="542" width="16" height="12" rx="2"/>
        <text class="sub" x="624" y="552">agentes de IA</text>
        <rect class="ok" x="732" y="542" width="16" height="12" rx="2"/>
        <text class="sub" x="756" y="552">produção</text>
        <rect class="warn" x="832" y="542" width="16" height="12" rx="2"/>
        <text class="sub" x="856" y="552">eu</text>
      </svg>
