        <rect class="zone" x="40" y="232" width="880" height="108" rx="8"/>
        <text class="eyebrow" x="56" y="256" text-anchor="start">EXEMPLO REAL</text>
        <rect class="mask" x="52" y="40" width="184" height="56" rx="6"/>
        <rect class="node" x="52" y="40" width="184" height="56" rx="6"/>
        <text class="name" x="144" y="65" text-anchor="middle">Mensagem</text>
        <text class="sub" x="144" y="82" text-anchor="middle">WhatsApp</text>
        <rect class="mask" x="276" y="40" width="184" height="56" rx="6"/>
        <rect class="ai" x="276" y="40" width="184" height="56" rx="6"/>
        <text class="name" x="368" y="65" text-anchor="middle">IA com a persona</text>
        <text class="sub" x="368" y="82" text-anchor="middle">Cigana Sarah</text>
        <rect class="mask" x="500" y="40" width="184" height="56" rx="6"/>
        <rect class="ok" x="500" y="40" width="184" height="56" rx="6"/>
        <text class="name" x="592" y="65" text-anchor="middle">Guarda no código</text>
        <text class="sub" x="592" y="82" text-anchor="middle">confere antes de sair</text>
        <rect class="mask" x="724" y="40" width="184" height="56" rx="6"/>
        <rect class="node" x="724" y="40" width="184" height="56" rx="6"/>
        <text class="name" x="816" y="65" text-anchor="middle">Resposta</text>
        <text class="sub" x="816" y="82" text-anchor="middle">para a pessoa</text>
        <rect class="warn dashed" x="276" y="112" width="184" height="88" rx="6"/>
        <text class="eyebrow warn-t" x="368" y="134" text-anchor="middle">PEDE (PODE FALHAR)</text>
        <text class="sub" x="368" y="158" text-anchor="middle">"não deduza o estado"</text>
        <text class="sub" x="368" y="176" text-anchor="middle">"tom acolhedor"</text>
        <rect class="ok" x="500" y="112" width="184" height="88" rx="6"/>
        <text class="eyebrow ok-t" x="592" y="134" text-anchor="middle">GARANTE</text>
        <text class="sub" x="592" y="156" text-anchor="middle">apaga o que não foi dito</text>
        <text class="sub" x="592" y="172" text-anchor="middle">amigo/amiga pelo nome</text>
        <text class="sub" x="592" y="188" text-anchor="middle">Pix antes da leitura</text>
        <rect class="mask" x="52" y="272" width="184" height="56" rx="6"/>
        <rect class="node" x="52" y="272" width="184" height="56" rx="6"/>
        <text class="name" x="144" y="297" text-anchor="middle">"nasci em [cidade]"</text>
        <text class="sub" x="144" y="314" text-anchor="middle">sem estado</text>
        <rect class="mask" x="276" y="272" width="184" height="56" rx="6"/>
        <rect class="bad" x="276" y="272" width="184" height="56" rx="6"/>
        <text class="name" x="368" y="297" text-anchor="middle">"[cidade], UF"</text>
        <text class="sub" x="368" y="314" text-anchor="middle">a IA deduziu o estado</text>
        <rect class="mask" x="500" y="272" width="184" height="56" rx="6"/>
        <rect class="ok" x="500" y="272" width="184" height="56" rx="6"/>
        <text class="name" x="592" y="297" text-anchor="middle">Código apaga o UF</text>
        <text class="sub" x="592" y="314" text-anchor="middle">a pessoa não disse</text>
        <rect class="mask" x="724" y="272" width="184" height="56" rx="6"/>
        <rect class="node" x="724" y="272" width="184" height="56" rx="6"/>
        <text class="name" x="816" y="297" text-anchor="middle">Mapa certo</text>
        <text class="sub" x="816" y="314" text-anchor="middle">só com o que ela disse</text>
        <text class="callout" x="480" y="376" text-anchor="middle"><tspan class="warn-t">Prompt é pedido.</tspan> <tspan class="ok-t">Código é garantia.</tspan></text>
        <line class="hair" x1="40" y1="400" x2="920" y2="400"/>
        <text class="eyebrow" x="40" y="424" text-anchor="start">LEGENDA</text>
        <rect class="ai" x="140" y="412" width="24" height="14" rx="3"/>
        <text class="sub" x="176" y="424" text-anchor="start">IA</text>
        <rect class="warn" x="241" y="412" width="24" height="14" rx="3"/>
        <text class="sub" x="277" y="424" text-anchor="start">pedido, pode falhar</text>
        <rect class="ok" x="458" y="412" width="24" height="14" rx="3"/>
        <text class="sub" x="494" y="424" text-anchor="start">garantido no código</text>
        <rect class="bad" x="675" y="412" width="24" height="14" rx="3"/>
        <text class="sub" x="711" y="424" text-anchor="start">erro da IA</text>
