        <rect class="bg" width="100%" height="100%"/>

        <!-- Zonas -->
        <rect class="zone" x="36" y="40" width="400" height="360" rx="8"/>
        <text class="eyebrow bad-t" x="52" y="64">ANTES</text>
        <rect class="zone" x="484" y="40" width="440" height="360" rx="8"/>
        <text class="eyebrow acc-t" x="500" y="64">DEPOIS</text>

        <!-- Antes: eu no meio de cada projeto -->
        <path class="arr-bad dash2" d="M196 156 V196"/>
        <path class="arr-bad dash2" d="M276 156 V196"/>
        <path class="arr-bad dash2" d="M196 252 V284"/>
        <path class="arr-bad dash2" d="M276 252 V284"/>
        <rect class="node" x="52" y="100" width="160" height="56" rx="6"/>
        <text class="name" x="132" y="124" text-anchor="middle">Projeto A</text>
        <text class="sub" x="132" y="142" text-anchor="middle">deploy por script 1</text>
        <rect class="node" x="260" y="100" width="160" height="56" rx="6"/>
        <text class="name" x="340" y="124" text-anchor="middle">Projeto B</text>
        <text class="sub" x="340" y="142" text-anchor="middle">deploy por script 2</text>
        <rect class="mask" x="148" y="196" width="176" height="56" rx="6"/>
        <rect class="bad" x="148" y="196" width="176" height="56" rx="6"/>
        <text class="name" x="236" y="220" text-anchor="middle">Eu</text>
        <text class="sub" x="236" y="238" text-anchor="middle">carimbando cada passo</text>
        <rect class="node" x="52" y="284" width="160" height="56" rx="6"/>
        <text class="name" x="132" y="308" text-anchor="middle">Projeto C</text>
        <text class="sub" x="132" y="326" text-anchor="middle">senha num arquivo</text>
        <rect class="node" x="260" y="284" width="160" height="56" rx="6"/>
        <text class="name" x="340" y="308" text-anchor="middle">Projeto D</text>
        <text class="sub" x="340" y="326" text-anchor="middle">outra arquitetura</text>
        <text class="callout" x="236" y="380" text-anchor="middle">Cada projeto de um jeito, e eu no meio de todos.</text>

        <!-- Depois: padrão escrito e os três passos -->
        <path class="arr-ok" d="M560 168 V232" marker-end="url(#diagrama-arrow-ok)"/>
        <path class="arr-ok" d="M704 168 V232" marker-end="url(#diagrama-arrow-ok)"/>
        <path class="arr-ok" d="M848 168 V232" marker-end="url(#diagrama-arrow-ok)"/>
        <path class="arr-ok" d="M620 268 H640" marker-end="url(#diagrama-arrow-ok)"/>
        <path class="arr-ok" d="M764 268 H784" marker-end="url(#diagrama-arrow-ok)"/>
        <rect class="mask" x="500" y="96" width="408" height="72" rx="6"/>
        <rect class="focal" x="500" y="96" width="408" height="72" rx="6"/>
        <text class="name" x="704" y="120" text-anchor="middle">Padrão escrito</text>
        <text class="sub" x="704" y="140" text-anchor="middle">stack · arquitetura · 7 regras de código</text>
        <text class="sub" x="704" y="156" text-anchor="middle">instruções por repositório · decisões</text>
        <rect class="mask" x="500" y="236" width="120" height="64" rx="6"/>
        <rect class="ok" x="500" y="236" width="120" height="64" rx="6"/>
        <text class="eyebrow ok-t" x="560" y="254" text-anchor="middle">PASSO 1</text>
        <text class="name" x="560" y="274" text-anchor="middle">Novo projeto</text>
        <text class="sub" x="560" y="290" text-anchor="middle">especificação</text>
        <rect class="mask" x="644" y="236" width="120" height="64" rx="6"/>
        <rect class="ok" x="644" y="236" width="120" height="64" rx="6"/>
        <text class="eyebrow ok-t" x="704" y="254" text-anchor="middle">PASSO 2</text>
        <text class="name" x="704" y="274" text-anchor="middle">Bootstrap</text>
        <text class="sub" x="704" y="290" text-anchor="middle">até o 1º deploy</text>
        <rect class="mask" x="788" y="236" width="120" height="64" rx="6"/>
        <rect class="ok" x="788" y="236" width="120" height="64" rx="6"/>
        <text class="eyebrow ok-t" x="848" y="254" text-anchor="middle">PASSO 3</text>
        <text class="name" x="848" y="274" text-anchor="middle">Desenvolver</text>
        <text class="sub" x="848" y="290" text-anchor="middle">tarefa a tarefa</text>
        <line class="zone" x1="632" y1="316" x2="632" y2="384"/>
        <text class="eyebrow" x="560" y="336" text-anchor="middle">PENSAR</text>
        <text class="callout" x="560" y="356" text-anchor="middle">só sai texto</text>
        <text class="eyebrow" x="776" y="336" text-anchor="middle">CONSTRUIR</text>
        <text class="callout" x="776" y="356" text-anchor="middle">outra sessão, no projeto</text>

        <!-- Legenda -->
        <line class="hair" x1="36" y1="424" x2="924" y2="424"/>
        <text class="eyebrow" x="36" y="448">LEGENDA</text>
        <path class="arr-bad dash2" d="M136 444 H168"/>
        <text class="sub" x="176" y="448">passa pela minha mão</text>
        <path class="arr-ok" d="M400 444 H432" marker-end="url(#diagrama-arrow-ok)"/>
        <text class="sub" x="440" y="448">segue o padrão</text>
      </svg>
