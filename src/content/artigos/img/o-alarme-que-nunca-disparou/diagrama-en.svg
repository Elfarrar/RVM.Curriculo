        <rect class="bg" width="100%" height="100%"/>

        <!-- Zonas -->
        <rect class="zone" x="36" y="40" width="888" height="148" rx="8"/>
        <text class="eyebrow bad-t" x="52" y="64">HOW IT WAS</text>
        <rect class="zone" x="36" y="204" width="888" height="120" rx="8"/>
        <text class="eyebrow acc-t" x="52" y="228">AFTER THE FIX</text>

        <!-- Setas -->
        <path class="arr" d="M244 116 H272" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr-bad" d="M464 116 H492" marker-end="url(#diagrama-en-arrow-bad)"/>
        <path class="arr-bad" d="M684 116 H712" marker-end="url(#diagrama-en-arrow-bad)"/>
        <path class="arr-acc" d="M370 144 V240" marker-end="url(#diagrama-en-arrow-accent)"/>
        <path class="arr-acc" d="M464 272 H492" marker-end="url(#diagrama-en-arrow-accent)"/>

        <!-- Como era -->
        <rect class="node" x="56" y="88" width="188" height="56" rx="6"/>
        <text class="name" x="150" y="112" text-anchor="middle">Audit queries</text>
        <text class="sub" x="150" y="130" text-anchor="middle">the container list</text>
        <rect class="mask" x="276" y="88" width="188" height="56" rx="6"/>
        <rect class="bad" x="276" y="88" width="188" height="56" rx="6"/>
        <text class="name" x="370" y="112" text-anchor="middle">Permission error</text>
        <text class="sub" x="370" y="130" text-anchor="middle">silently ignored</text>
        <rect class="mask" x="496" y="88" width="188" height="56" rx="6"/>
        <rect class="warn" x="496" y="88" width="188" height="56" rx="6"/>
        <text class="name" x="590" y="112" text-anchor="middle">Empty becomes zero</text>
        <text class="sub" x="590" y="130" text-anchor="middle">0 running × 0 expected</text>
        <rect class="mask" x="716" y="88" width="188" height="56" rx="6"/>
        <rect class="ok" x="716" y="88" width="188" height="56" rx="6"/>
        <text class="name" x="810" y="112" text-anchor="middle">Zero drift</text>
        <text class="sub" x="810" y="130" text-anchor="middle">"all good"</text>
        <text class="callout bad-t" x="904" y="172" text-anchor="end">Every day. The green was blindness.</text>

        <!-- Depois da correção -->
        <rect class="mask" x="276" y="244" width="188" height="56" rx="6"/>
        <rect class="warn" x="276" y="244" width="188" height="56" rx="6"/>
        <text class="name" x="370" y="268" text-anchor="middle">Audit stops</text>
        <text class="sub" x="370" y="286" text-anchor="middle">reports "not auditable"</text>
        <rect class="mask" x="496" y="244" width="240" height="56" rx="6"/>
        <rect class="ok" x="496" y="244" width="240" height="56" rx="6"/>
        <text class="name" x="616" y="268" text-anchor="middle">Alarm proven</text>
        <text class="sub" x="616" y="286" text-anchor="middle">planted difference: it fired</text>

        <!-- Legenda -->
        <line class="hair" x1="36" y1="348" x2="924" y2="348"/>
        <text class="eyebrow" x="36" y="372">LEGEND</text>
