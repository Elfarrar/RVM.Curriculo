<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" class="rvm-d" role="img" aria-labelledby="diagrama-07-en-title diagrama-07-en-desc" id="diagrama-en-root">
        <title id="diagrama-07-en-title">How a permission error became "all good"</title>
        <desc id="diagrama-07-en-desc">The audit asked for the container list, got a permission error that was ignored, treated the empty list as zero and reported zero drift every day; after the fix it stops and reports not auditable, and the alarm was proven by firing on a planted difference.</desc>
        <style>
          .rvm-d { --paper:#F4F5FA; --card:#FFFFFF; --ink:#28243D; --muted:#4D5056; --soft:#676C74;
                   --rule:rgba(40,36,61,0.12); --rule-solid:#D1D0D3; --accent:#264CC8; --accent-tint:rgba(38,76,200,0.08); --ok:#378100; --ok-line:#4CB200; --ok-tint:rgba(86,202,0,0.10); --bad:#A33134; --bad-line:#E04347; --bad-tint:rgba(255,76,81,0.10); --warn:#A37300; --warn-line:#E09E00; --warn-tint:rgba(255,180,0,0.12); --ai:#6E3FD1; --ai-line:#8A63E0; --ai-tint:rgba(138,99,224,0.10); }
