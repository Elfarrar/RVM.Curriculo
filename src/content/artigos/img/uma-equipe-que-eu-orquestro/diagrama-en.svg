<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 476" xmlns="http://www.w3.org/2000/svg" class="rvm-d" role="img" aria-labelledby="diagrama-09-en-title diagrama-09-en-desc" id="diagrama-en-root">
        <title id="diagrama-09-en-title">Maestro roles and the single queue</title>
        <desc id="diagrama-09-en-desc">The request goes through Maestro, which calls PMO, Developer, Reviewer, CI and QA in sequence; everything that depends on me lands in a single queue, and my answer resumes the task.</desc>
        <style>
          .rvm-d { --paper:#F4F5FA; --card:#FFFFFF; --ink:#28243D; --muted:#4D5056; --soft:#676C74;
                   --rule:rgba(40,36,61,0.12); --rule-solid:#D1D0D3; --accent:#264CC8; --accent-tint:rgba(38,76,200,0.08);
                   --ok:#378100; --ok-line:#4CB200; --ok-tint:rgba(86,202,0,0.10);
                   --bad:#A33134; --bad-line:#E04347; --bad-tint:rgba(255,76,81,0.10);
                   --warn:#A37300; --warn-line:#E09E00; --warn-tint:rgba(255,180,0,0.12);
                   --ai:#6E3FD1; --ai-line:#8A63E0; --ai-tint:rgba(138,99,224,0.10); }
          @media (prefers-color-scheme: dark) {
            .rvm-d { --paper:#28243D; --card:#312D4B; --ink:#F4F5FA; --muted:#CFCBE5; --soft:#9C9FA4;
                     --rule:rgba(244,245,250,0.12); --rule-solid:#5B5774; --accent:#8FA5F5; --accent-tint:rgba(143,165,245,0.12);
                     --ok:#6AD01F; --ok-line:#6AD01F; --ok-tint:rgba(106,208,31,0.14);
                     --bad:#FF6166; --bad-line:#FF6166; --bad-tint:rgba(255,97,102,0.14);
                     --warn:#FFB547; --warn-line:#FFB547; --warn-tint:rgba(255,181,71,0.14);
                     --ai:#B79CFF; --ai-line:#B79CFF; --ai-tint:rgba(183,156,255,0.14); }
          }
          .rvm-d text { font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; fill:var(--ink); }
          .rvm-d .bg { fill:var(--paper); }
          .rvm-d .zone { fill:none; stroke:var(--rule-solid); stroke-width:1; stroke-dasharray:4 4; }
          .rvm-d .mask { fill:var(--paper); }
          .rvm-d .node { fill:var(--card); stroke:var(--ink); stroke-width:1; }
          .rvm-d .focal { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
          .rvm-d .name { font-size:14px; font-weight:600; }
          .rvm-d .env { font-size:16px; font-weight:600; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .sub { font-size:11px; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .eyebrow { font-size:10px; font-weight:500; letter-spacing:0.16em; fill:var(--muted); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .lbl { font-size:10px; letter-spacing:0.06em; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
          .rvm-d .lbl-acc { fill:var(--accent); }
          .rvm-d .callout { font-size:13px; font-style:italic; fill:var(--muted); }
          .rvm-d .acc-t { fill:var(--accent); }
          .rvm-d .arr { fill:none; stroke:var(--muted); stroke-width:1.2; }
          .rvm-d .arr-acc { fill:none; stroke:var(--accent); stroke-width:1.6; }
          .rvm-d .dash { stroke-dasharray:5 4; }
          .rvm-d .opt { fill:var(--card); stroke:var(--soft); stroke-width:1; stroke-dasharray:4 3; }
          .rvm-d .hair { stroke:var(--rule); stroke-width:1; }
          .rvm-d .ah { fill:var(--muted); }
          .rvm-d .ah-acc { fill:var(--accent); }
          .rvm-d .ok   { fill:var(--ok-tint);   stroke:var(--ok-line);   stroke-width:1.2; }
          .rvm-d .bad  { fill:var(--bad-tint);  stroke:var(--bad-line);  stroke-width:1.2; }
          .rvm-d .warn { fill:var(--warn-tint); stroke:var(--warn-line); stroke-width:1.2; }
          .rvm-d .ai   { fill:var(--ai-tint);   stroke:var(--ai-line);   stroke-width:1.2; }
          .rvm-d .ok-t { fill:var(--ok); } .rvm-d .bad-t { fill:var(--bad); } .rvm-d .warn-t { fill:var(--warn); } .rvm-d .ai-t { fill:var(--ai); }
          .rvm-d .arr-ok  { fill:none; stroke:var(--ok-line);  stroke-width:1.6; }
          .rvm-d .arr-bad { fill:none; stroke:var(--bad-line); stroke-width:1.6; }
          .rvm-d .ah-ok { fill:var(--ok-line); } .rvm-d .ah-bad { fill:var(--bad-line); }
        </style>
        <defs>
      <style>#diagrama-en-root { --page: #F4F5FA; --page-ink: #28243D; --page-muted: #4D5056; }
      #diagrama-en-root { --page: #28243D; --page-ink: #F4F5FA; --page-muted: #CFCBE5; }
      #diagrama-en-root { font-family: 'Inter', system-ui, sans-serif; color: var(--page-ink); }
      #diagrama-en-root .diagram-container { width: 100%; overflow-x: auto; }
      #diagrama-en-root .diagram-container { overflow-x: visible; }
      #diagrama-en-root .rvm-d { --paper:#F4F5FA; --card:#FFFFFF; --ink:#28243D; --muted:#4D5056; --soft:#676C74;
                   --rule:rgba(40,36,61,0.12); --rule-solid:#D1D0D3; --accent:#264CC8; --accent-tint:rgba(38,76,200,0.08);
                   --ok:#378100; --ok-line:#4CB200; --ok-tint:rgba(86,202,0,0.10);
                   --bad:#A33134; --bad-line:#E04347; --bad-tint:rgba(255,76,81,0.10);
                   --warn:#A37300; --warn-line:#E09E00; --warn-tint:rgba(255,180,0,0.12);
                   --ai:#6E3FD1; --ai-line:#8A63E0; --ai-tint:rgba(138,99,224,0.10); }
      #diagrama-en-root .rvm-d { --paper:#28243D; --card:#312D4B; --ink:#F4F5FA; --muted:#CFCBE5; --soft:#9C9FA4;
                     --rule:rgba(244,245,250,0.12); --rule-solid:#5B5774; --accent:#8FA5F5; --accent-tint:rgba(143,165,245,0.12);
                     --ok:#6AD01F; --ok-line:#6AD01F; --ok-tint:rgba(106,208,31,0.14);
                     --bad:#FF6166; --bad-line:#FF6166; --bad-tint:rgba(255,97,102,0.14);
                     --warn:#FFB547; --warn-line:#FFB547; --warn-tint:rgba(255,181,71,0.14);
                     --ai:#B79CFF; --ai-line:#B79CFF; --ai-tint:rgba(183,156,255,0.14); }
      #diagrama-en-root .rvm-d text { font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; fill:var(--ink); }
      #diagrama-en-root .rvm-d .bg { fill:var(--paper); }
      #diagrama-en-root .rvm-d .zone { fill:none; stroke:var(--rule-solid); stroke-width:1; stroke-dasharray:4 4; }
      #diagrama-en-root .rvm-d .mask { fill:var(--paper); }
      #diagrama-en-root .rvm-d .node { fill:var(--card); stroke:var(--ink); stroke-width:1; }
      #diagrama-en-root .rvm-d .focal { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
      #diagrama-en-root .rvm-d .name { font-size:14px; font-weight:600; }
      #diagrama-en-root .rvm-d .env { font-size:16px; font-weight:600; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-en-root .rvm-d .sub { font-size:11px; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-en-root .rvm-d .eyebrow { font-size:10px; font-weight:500; letter-spacing:0.16em; fill:var(--muted); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-en-root .rvm-d .lbl { font-size:10px; letter-spacing:0.06em; fill:var(--soft); font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #diagrama-en-root .rvm-d .lbl-acc { fill:var(--accent); }
      #diagrama-en-root .rvm-d .callout { font-size:13px; font-style:italic; fill:var(--muted); }
      #diagrama-en-root .rvm-d .acc-t { fill:var(--accent); }
      #diagrama-en-root .rvm-d .arr { fill:none; stroke:var(--muted); stroke-width:1.2; }
      #diagrama-en-root .rvm-d .arr-acc { fill:none; stroke:var(--accent); stroke-width:1.6; }
      #diagrama-en-root .rvm-d .dash { stroke-dasharray:5 4; }
      #diagrama-en-root .rvm-d .opt { fill:var(--card); stroke:var(--soft); stroke-width:1; stroke-dasharray:4 3; }
      #diagrama-en-root .rvm-d .hair { stroke:var(--rule); stroke-width:1; }
      #diagrama-en-root .rvm-d .ah { fill:var(--muted); }
      #diagrama-en-root .rvm-d .ah-acc { fill:var(--accent); }
      #diagrama-en-root .rvm-d .ok { fill:var(--ok-tint);   stroke:var(--ok-line);   stroke-width:1.2; }
      #diagrama-en-root .rvm-d .bad { fill:var(--bad-tint);  stroke:var(--bad-line);  stroke-width:1.2; }
      #diagrama-en-root .rvm-d .warn { fill:var(--warn-tint); stroke:var(--warn-line); stroke-width:1.2; }
      #diagrama-en-root .rvm-d .ai { fill:var(--ai-tint);   stroke:var(--ai-line);   stroke-width:1.2; }
      #diagrama-en-root .rvm-d .ok-t { fill:var(--ok); }
      #diagrama-en-root .rvm-d .bad-t { fill:var(--bad); }
      #diagrama-en-root .rvm-d .warn-t { fill:var(--warn); }
      #diagrama-en-root .rvm-d .ai-t { fill:var(--ai); }
      #diagrama-en-root .rvm-d .arr-ok { fill:none; stroke:var(--ok-line);  stroke-width:1.6; }
      #diagrama-en-root .rvm-d .arr-bad { fill:none; stroke:var(--bad-line); stroke-width:1.6; }
      #diagrama-en-root .rvm-d .ah-ok { fill:var(--ok-line); }
      #diagrama-en-root .rvm-d .ah-bad { fill:var(--bad-line); }</style>
          <marker id="diagrama-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-acc" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-ok" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-en-arrow-bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-bad" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="bg" width="100%" height="100%"/>

        <!-- Zona: os papéis -->
        <rect class="zone" x="40" y="132" width="880" height="152" rx="8"/>
        <text class="eyebrow ai-t" x="148" y="156">ROLES · FIXED MODEL PER ROLE · PERMISSIONS COME FROM THE PROFILE, NOT THE REQUEST</text>

        <!-- Setas -->
        <path class="arr" d="M204 68 H272" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="216" y="46" width="48" height="14" rx="2"/>
        <text class="lbl" x="240" y="56" text-anchor="middle">REQUEST</text>
        <path class="arr dash" d="M484 68 H572" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="488" y="46" width="80" height="14" rx="2"/>
        <text class="lbl" x="528" y="56" text-anchor="middle">ON DEMAND</text>
        <path class="arr" d="M300 96 V104 Q300 112 292 112 H136 Q128 112 128 120 V172" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr" d="M204 200 H224" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr" d="M380 200 H400" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr" d="M556 200 H576" marker-end="url(#diagrama-en-arrow)"/>
        <path class="arr" d="M732 200 H752" marker-end="url(#diagrama-en-arrow)"/>
        <!-- Revisor devolve ao Desenvolvedor -->
        <path class="arr-bad dash" d="M464 228 V244 Q464 252 456 252 H328 Q320 252 320 244 V232" marker-end="url(#diagrama-en-arrow-bad)"/>
        <rect class="mask" x="320" y="258" width="144" height="14" rx="2"/>
        <text class="lbl bad-t" x="392" y="268" text-anchor="middle">FOUND A PROBLEM</text>
        <!-- Entrega na fila -->
        <path class="arr" d="M832 228 V316" marker-end="url(#diagrama-en-arrow)"/>
        <rect class="mask" x="680" y="292" width="144" height="14" rx="2"/>
        <text class="lbl" x="820" y="302" text-anchor="end">PR, CI, SCREENSHOT</text>
        <!-- Minha resposta retoma -->
        <path class="arr-acc" d="M440 360 H32 Q24 360 24 352 V76 Q24 68 32 68 H48" marker-end="url(#diagrama-en-arrow-accent)"/>
        <rect class="mask" x="168" y="338" width="128" height="14" rx="2"/>
        <text class="lbl lbl-acc" x="232" y="348" text-anchor="middle">MY ANSWER</text>

        <!-- Linha 1 -->
        <rect class="mask" x="52" y="40" width="152" height="56" rx="6"/>
        <rect class="warn" x="52" y="40" width="152" height="56" rx="6"/>
        <text class="name" x="128" y="64" text-anchor="middle">Me</text>
        <text class="sub" x="128" y="82" text-anchor="middle">terminal or dashboard</text>

        <rect class="mask" x="276" y="40" width="208" height="56" rx="6"/>
        <rect class="focal" x="276" y="40" width="208" height="56" rx="6"/>
        <text class="name" x="380" y="64" text-anchor="middle">Maestro</text>
        <text class="sub" x="380" y="82" text-anchor="middle">routes and calls each role</text>

        <rect class="mask" x="576" y="40" width="248" height="56" rx="6"/>
        <rect class="ai dash" x="576" y="40" width="248" height="56" rx="6"/>
        <text class="name" x="700" y="64" text-anchor="middle">Architect · DevOps</text>
        <text class="sub" x="700" y="82" text-anchor="middle">specs with me · reads servers</text>

        <!-- Linha 2: o fluxo da tarefa -->
        <rect class="mask" x="52" y="172" width="152" height="56" rx="6"/>
        <rect class="ai" x="52" y="172" width="152" height="56" rx="6"/>
        <text class="name" x="128" y="196" text-anchor="middle">PMO</text>
        <text class="sub" x="128" y="214" text-anchor="middle">becomes an issue</text>

        <rect class="mask" x="228" y="172" width="152" height="56" rx="6"/>
        <rect class="ai" x="228" y="172" width="152" height="56" rx="6"/>
        <text class="name" x="304" y="196" text-anchor="middle">Developer</text>
        <text class="sub" x="304" y="214" text-anchor="middle">code + PR</text>

        <rect class="mask" x="404" y="172" width="152" height="56" rx="6"/>
        <rect class="ai" x="404" y="172" width="152" height="56" rx="6"/>
        <text class="name" x="480" y="196" text-anchor="middle">Reviewer</text>
        <text class="sub" x="480" y="214" text-anchor="middle">another vendor</text>

        <rect class="mask" x="580" y="172" width="152" height="56" rx="6"/>
        <rect class="ok" x="580" y="172" width="152" height="56" rx="6"/>
        <text class="name" x="656" y="196" text-anchor="middle">CI + dev deploy</text>
        <text class="sub" x="656" y="214" text-anchor="middle">automatic</text>

        <rect class="mask" x="756" y="172" width="152" height="56" rx="6"/>
        <rect class="ai" x="756" y="172" width="152" height="56" rx="6"/>
        <text class="name" x="832" y="196" text-anchor="middle">QA</text>
        <text class="sub" x="832" y="214" text-anchor="middle">screenshot</text>

        <!-- Linha 3: a fila única -->
        <rect class="mask" x="440" y="316" width="480" height="88" rx="6"/>
        <rect class="warn" x="440" y="316" width="480" height="88" rx="6"/>
        <text class="eyebrow warn-t" x="680" y="336" text-anchor="middle">SINGLE QUEUE</text>
        <text class="name" x="680" y="356" text-anchor="middle">Waiting for you</text>
        <text class="sub" x="680" y="376" text-anchor="middle">scope question · infra approval · promotion to prd</text>
        <text class="sub" x="680" y="394" text-anchor="middle">dashboard + Telegram buttons</text>

        <!-- Legenda -->
        <line class="hair" x1="40" y1="432" x2="920" y2="432"/>
        <text class="eyebrow" x="40" y="456">LEGEND</text>
        <path class="arr" d="M136 452 H168" marker-end="url(#diagrama-en-arrow)"/>
        <text class="sub" x="176" y="456">automatic</text>
        <path class="arr-bad dash" d="M268 452 H300" marker-end="url(#diagrama-en-arrow-bad)"/>
        <text class="sub" x="308" y="456">found a problem</text>
        <rect class="ai" x="428" y="446" width="16" height="12" rx="2"/>
        <text class="sub" x="452" y="456">AI role</text>
        <rect class="ok" x="548" y="446" width="16" height="12" rx="2"/>
        <text class="sub" x="572" y="456">automatic check</text>
        <rect class="warn" x="720" y="446" width="16" height="12" rx="2"/>
        <text class="sub" x="744" y="456">depends on me</text>
      </svg>
