          <marker id="diagrama-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-acc" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-ok" points="0 0, 8 3, 0 6"/></marker>
          <marker id="diagrama-arrow-bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ah-bad" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="bg" width="100%" height="100%"/>

        <!-- Zona: o que a máquina verifica sozinha -->
        <rect class="zone" x="40" y="32" width="880" height="148" rx="8"/>
        <text class="eyebrow acc-t" x="56" y="56">A MÁQUINA VERIFICA, SEM ME PERGUNTAR</text>

        <!-- Setas (antes das caixas) -->
        <path class="arr" d="M204 108 H224" marker-end="url(#diagrama-arrow)"/>
        <path class="arr" d="M380 108 H400" marker-end="url(#diagrama-arrow)"/>
        <path class="arr" d="M556 108 H576" marker-end="url(#diagrama-arrow)"/>
        <path class="arr" d="M732 108 H752" marker-end="url(#diagrama-arrow)"/>
        <!-- Deploy cai na dev -->
        <path class="arr" d="M832 136 V204 Q832 212 824 212 H136 Q128 212 128 220 V244" marker-end="url(#diagrama-arrow)"/>
        <rect class="mask" x="436" y="190" width="104" height="14" rx="2"/>
        <text class="lbl" x="488" y="200" text-anchor="middle">DEPLOY NA DEV</text>
        <!-- dev → stg → portão → prd -->
        <path class="arr-ok" d="M204 280 H296" marker-end="url(#diagrama-arrow-ok)"/>
        <rect class="mask" x="212" y="258" width="80" height="14" rx="2"/>
        <text class="lbl ok-t" x="252" y="268" text-anchor="middle">AUTOMÁTICO</text>
        <path class="arr-bad" d="M452 280 H528" marker-end="url(#diagrama-arrow-bad)"/>
        <path class="arr-bad" d="M732 280 H760" marker-end="url(#diagrama-arrow-bad)"/>

        <!-- Linha 1: o ciclo da tarefa -->
        <rect class="mask" x="52" y="80" width="152" height="56" rx="6"/>
        <rect class="focal" x="52" y="80" width="152" height="56" rx="6"/>
        <text class="name" x="128" y="104" text-anchor="middle">Tarefa</text>
        <text class="sub" x="128" y="122" text-anchor="middle">branch da stg</text>

        <rect class="mask" x="228" y="80" width="152" height="56" rx="6"/>
        <rect class="focal" x="228" y="80" width="152" height="56" rx="6"/>
        <text class="name" x="304" y="104" text-anchor="middle">Código + testes</text>
        <text class="sub" x="304" y="122" text-anchor="middle">exit code 0</text>

        <rect class="mask" x="404" y="80" width="152" height="56" rx="6"/>
        <rect class="focal" x="404" y="80" width="152" height="56" rx="6"/>
        <text class="name" x="480" y="104" text-anchor="middle">Ponta a ponta</text>
        <text class="sub" x="480" y="122" text-anchor="middle">navegador + print</text>

        <rect class="mask" x="580" y="80" width="152" height="56" rx="6"/>
        <rect class="focal" x="580" y="80" width="152" height="56" rx="6"/>
        <text class="name" x="656" y="104" text-anchor="middle">Pull request</text>
        <text class="sub" x="656" y="122" text-anchor="middle">pipeline verde</text>

        <rect class="mask" x="756" y="80" width="152" height="56" rx="6"/>
        <rect class="focal" x="756" y="80" width="152" height="56" rx="6"/>
        <text class="name" x="832" y="104" text-anchor="middle">Deploy</text>
        <text class="sub" x="832" y="122" text-anchor="middle">/health 200</text>

        <text class="callout warn-t" x="56" y="164">Duas tentativas sem verde: a IA para e me mostra o erro.</text>

        <!-- Linha 2: ambientes e o portão -->
        <rect class="mask" x="52" y="252" width="152" height="56" rx="6"/>
        <rect class="ok" x="52" y="252" width="152" height="56" rx="6"/>
        <text class="env" x="128" y="276" text-anchor="middle">dev</text>
        <text class="sub" x="128" y="296" text-anchor="middle">só recebe tarefas</text>

        <rect class="mask" x="300" y="252" width="152" height="56" rx="6"/>
        <rect class="ok" x="300" y="252" width="152" height="56" rx="6"/>
        <text class="env" x="376" y="276" text-anchor="middle">stg</text>
        <text class="sub" x="376" y="296" text-anchor="middle">só recebe da dev</text>

        <rect class="mask" x="532" y="240" width="200" height="80" rx="6"/>
        <rect class="bad" x="532" y="240" width="200" height="80" rx="6"/>
        <text class="eyebrow bad-t" x="632" y="262" text-anchor="middle">PORTÃO HUMANO</text>
        <text class="name" x="632" y="284" text-anchor="middle">Eu julgo a tela</text>
        <text class="sub" x="632" y="304" text-anchor="middle">"aprovado" sobe o lote</text>

        <rect class="mask" x="764" y="252" width="144" height="56" rx="6"/>
        <rect class="ok" x="764" y="252" width="144" height="56" rx="6"/>
        <text class="env" x="836" y="276" text-anchor="middle">prd</text>
        <text class="sub" x="836" y="296" text-anchor="middle">só recebe da stg</text>

        <text class="callout" x="632" y="344" text-anchor="middle">Item reprovado vira ajuste prioritário, e o lote espera.</text>

        <!-- Legenda -->
        <line class="hair" x1="40" y1="372" x2="920" y2="372"/>
        <text class="eyebrow" x="40" y="396">LEGENDA</text>
        <path class="arr-ok" d="M136 392 H168" marker-end="url(#diagrama-arrow-ok)"/>
        <text class="sub" x="176" y="396">sem intervenção minha</text>
        <path class="arr-bad" d="M360 392 H392" marker-end="url(#diagrama-arrow-bad)"/>
        <text class="sub" x="400" y="396">só com o meu aval</text>
      </svg>
